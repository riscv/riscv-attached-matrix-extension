<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Logical square mapping to M registers</title>
  <desc id="desc">Examples of exact-fit, wide, and packed datatype mappings. Every logical square contains N squared elements.</desc>

  <defs>
    <style>
      .text { font-family: Arial, Helvetica, sans-serif; fill: #222b36; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .muted { fill: #737b86; }
      .reg { fill: #add5ee; stroke: #26333d; stroke-width: 2; }
      .packed-a { fill: #add5ee; stroke: #26333d; stroke-width: 2; }
      .packed-b { fill: #a9ddb9; stroke: #26333d; stroke-width: 2; }
      .cell { stroke: #3e6f91; stroke-width: 1.5; }
      .separator { stroke: #d2d7dc; stroke-width: 1.5; stroke-dasharray: 6 7; }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#ffffff"/>
  <line class="separator" x1="400" y1="12" x2="400" y2="248"/>
  <line class="separator" x1="800" y1="12" x2="800" y2="248"/>

  <!-- Exact fit: one complete logical square in one M register. -->
  <text class="text heading" x="200" y="32" text-anchor="middle">Exact fit</text>
  <text class="text body" x="22" y="105">M[i]</text>
  <rect class="reg" x="72" y="62" width="260" height="66"/>
  <line class="cell" x1="137" y1="62" x2="137" y2="128"/>
  <line class="cell" x1="202" y1="62" x2="202" y2="128"/>
  <line class="cell" x1="267" y1="62" x2="267" y2="128"/>
  <text class="text small" x="104" y="101" text-anchor="middle">e0</text>
  <text class="text small" x="169" y="101" text-anchor="middle">e1</text>
  <text class="text small" x="234" y="101" text-anchor="middle">…</text>
  <text class="text small" x="299" y="101" text-anchor="middle">e(N²−1)</text>
  <text class="text body" x="200" y="162" text-anchor="middle">sizeof(dtype) =</text>
  <text class="text body" x="200" y="184" text-anchor="middle">AME_UNIT_DATATYPE_SIZE</text>
  <text class="text small muted" x="200" y="211" text-anchor="middle">one N × N square; AME_NELEM = N²</text>

  <!-- Wide datatype: one complete logical square is split across a register group. -->
  <text class="text heading" x="600" y="32" text-anchor="middle">Multiple M registers (group)</text>
  <text class="text body" x="423" y="86">M[i]</text>
  <text class="text body" x="412" y="151">M[i+1]</text>
  <rect class="reg" x="470" y="54" width="250" height="52"/>
  <rect class="reg" x="470" y="119" width="250" height="52"/>
  <text class="text body" x="595" y="86" text-anchor="middle">square fragment 0</text>
  <text class="text body" x="595" y="151" text-anchor="middle">square fragment 1</text>
  <path d="M 738 54 h 14 v 117 h -14" fill="none" stroke="#26333d" stroke-width="2"/>
  <text class="text small" x="760" y="116">group</text>
  <text class="text body" x="600" y="200" text-anchor="middle">sizeof(dtype) = 2 × AME_UNIT_DATATYPE_SIZE</text>
  <text class="text small muted" x="600" y="225" text-anchor="middle">one N × N square assembled from the complete group</text>

  <!-- Packed datatype: multiple complete logical squares share one M register. -->
  <text class="text heading" x="1000" y="32" text-anchor="middle">Packed</text>
  <text class="text body" x="820" y="105">M[i]</text>
  <rect class="packed-a" x="868" y="62" width="130" height="66"/>
  <rect class="packed-b" x="998" y="62" width="130" height="66"/>
  <text class="text small" x="933" y="88" text-anchor="middle">N × N</text>
  <text class="text small" x="933" y="110" text-anchor="middle">square 0</text>
  <text class="text small" x="1063" y="88" text-anchor="middle">N × N</text>
  <text class="text small" x="1063" y="110" text-anchor="middle">square 1</text>
  <text class="text body" x="1000" y="162" text-anchor="middle">sizeof(dtype) = AME_UNIT_DATATYPE_SIZE / 2</text>
  <text class="text small muted" x="1000" y="188" text-anchor="middle">pack_factor = 2 shown</text>
  <text class="text small muted" x="1000" y="211" text-anchor="middle">two complete N × N squares share one M register</text>
</svg>
